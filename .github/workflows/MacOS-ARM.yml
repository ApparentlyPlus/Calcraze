name: Deploy macOS (Apple Silicon)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Deploy_ARM_MacOS:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish /p:PublishProfile=ArmMac

      - name: Verify publish output
        run: |
          if [ ! -d "publish" ]; then
            echo "::error::publish/ directory not found"
            exit 1
          fi
          count=$(find publish -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::publish/ directory is empty"
            exit 1
          fi
          echo "publish/ contains $count file(s)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-publish
          path: publish/